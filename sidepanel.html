<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频笔记</title>
  <link rel="stylesheet" href="lib/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="lib/ui.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 14px 16px; font-size: 14px; line-height: 1.6; }

    /* ---- 头部:品牌与视频标题同行,meta 一行(规范 5) ---- */
    header { margin-bottom: 10px; }
    .brand-row { display: flex; align-items: center; gap: 8px; }
    .brand-row img { width: 26px; height: 26px; border-radius: 6px; flex: none; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; word-break: break-all;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .wave { margin-left: auto; flex: none; }
    .meta-line { font-size: 12px; color: var(--dim); margin-top: 3px;
                 display: flex; gap: 6px; align-items: baseline; }
    #meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #status { color: var(--ok); flex: none; }
    #status.err { color: var(--err); }

    /* ---- 分段胶囊页签(规范 6,吸顶) ---- */
    nav { display: flex; gap: 2px; padding: 3px; margin-bottom: 12px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
          position: sticky; top: 8px; z-index: 10; }
    nav button { flex: 1; border: none; background: none; padding: 5px 4px; font-size: 13px;
                 color: var(--dim); border-radius: 999px; cursor: pointer; white-space: nowrap; }
    nav button:hover { color: var(--text); background: none; }
    nav button.on { background: var(--surface); color: var(--text); font-weight: 600;
                    box-shadow: var(--shadow-1); }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    .row .spacer { margin-left: auto; }
    section { display: none; }
    section.on { display: block; }
    .empty { color: var(--faint); font-size: 13px; padding: 28px 0; text-align: center; }

    /* ---- 字幕视图 ---- */
    .modes { display: flex; gap: 4px; margin-bottom: 10px; }
    .modes button { padding: 2px 12px; font-size: 12px; border-radius: 999px; }
    .modes button.on { background: var(--accent-soft); border-color: var(--accent);
                       color: var(--accent); }
    .modes button.on:hover { background: var(--accent-soft); }
    .cue { padding: 5px 9px; border-radius: 8px; cursor: pointer;
           border-left: 3px solid transparent; }
    .cue:hover { background: var(--surface); }
    .cue.now { background: var(--accent-soft); border-left-color: var(--accent); }
    /* 时间码 chip(签名元素) */
    .cue .t, .chapter .t, .an-ts, .note .ts, .qa-q .ts, .quote-item .t {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      color: var(--accent); background: var(--accent-soft);
      padding: 1px 6px; border-radius: 5px; letter-spacing: 0.02em;
      cursor: pointer; white-space: nowrap; }
    .cue .t:hover, .chapter .t:hover, .an-ts:hover, .note .ts:hover,
    .qa-q .ts:hover, .quote-item .t:hover { background: rgba(230, 72, 93, 0.18); }
    .cue .t { margin-right: 8px; }
    .cue .en { display: block; color: var(--dim); font-size: 12px; margin-top: 1px; }

    /* ---- 概览视图 ---- */
    .chapter { padding: 8px 10px; cursor: pointer; border-radius: 8px; }
    .chapter:hover { background: var(--surface); }
    .chapter .ct { font-weight: 600; }
    .chapter .cs { color: var(--dim); font-size: 12px; margin-top: 2px; }
    .quote-item { border-left: 3px solid var(--line-strong); padding: 4px 10px;
                  margin: 8px 0; color: var(--dim); font-size: 13px; }

    /* ---- 笔记 / 助教卡片(规范 6:白底 + 1px 描边) ---- */
    .note, .qa-item { background: var(--surface); border: 1px solid var(--line);
                      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; }
    .note .del, .qa-q .del { float: right; border: none; background: none; color: var(--faint);
                             padding: 0 4px; font-size: 14px; cursor: pointer; }
    .note .del:hover, .qa-q .del:hover { color: var(--err); background: none; }
    .note .edit-btn { float: right; padding: 1px 10px; font-size: 12px; margin-right: 4px; }
    .note .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
    .note .quote { color: var(--dim); font-size: 12px; margin: 4px 0; }
    .note .comment { white-space: pre-wrap; word-break: break-word; }
    .note img { max-width: 100%; border-radius: 6px; margin-top: 6px; cursor: zoom-in; }
    .note .shot-actions { margin-top: 6px; display: flex; gap: 6px; }
    .note .shot-actions button { padding: 2px 10px; font-size: 12px; }
    .note .edit-area { width: 100%; min-height: 48px; resize: vertical; padding: 6px 8px;
                       font: 13px/1.5 var(--font-body); margin-top: 6px; }
    .note .edit-bar { margin-top: 6px; display: flex; gap: 6px; }
    .note .edit-bar button { padding: 2px 10px; font-size: 12px; }

    /* 笔记区垂直子标签:与顶部页签同语言(竖向左线选中态) */
    .notes-layout { display: flex; gap: 12px; align-items: flex-start; }
    .notes-tabs { display: flex; flex-direction: column; gap: 2px; flex: none;
                  border-right: 1px solid var(--line); padding-right: 8px; }
    .notes-tabs button { border: none; background: none; padding: 6px 10px; font-size: 13px;
                         cursor: pointer; color: var(--dim); border-left: 2px solid transparent;
                         border-radius: 0; text-align: left; white-space: nowrap; }
    .notes-tabs button.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .notes-tabs button:hover { color: var(--text); background: none; }
    .notes-panes { flex: 1; min-width: 0; }
    .notes-pane { display: none; }
    .notes-pane.on { display: block; }
    #anote-tpl { flex: 1; min-width: 0; padding: 6px 8px; font-size: 13px; }

    /* ---- Markdown 渲染内容(自动笔记/助教/预览共用) ---- */
    #anote, .qa-a, #draft-preview { font-size: 13px; }
    #anote table, .qa-a table, #draft-preview table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
    #anote th, #anote td, .qa-a th, .qa-a td, #draft-preview th, #draft-preview td {
      border: 1px solid var(--line-strong); padding: 4px 8px; text-align: left; }
    #anote th, .qa-a th, #draft-preview th { background: var(--panel); }
    #anote pre, .qa-a pre, #draft-preview pre { background: var(--panel); padding: 10px;
      border-radius: 8px; overflow-x: auto; font-size: 12px; border: 1px solid var(--line); }
    #anote code, .qa-a code, #draft-preview code { font-family: var(--font-mono);
      font-size: 12px; background: var(--panel); padding: 0 4px; border-radius: 4px; }
    #anote pre code, .qa-a pre code, #draft-preview pre code { background: none; padding: 0; }
    .katex { font-size: 1.05em; }
    #anote h2, .qa-a h2, #draft-preview h2 { font-size: 14px; margin: 14px 0 6px; }
    #anote h3, .qa-a h3, #draft-preview h3 { font-size: 13px; margin: 10px 0 4px; }
    #anote p, .qa-a p, #draft-preview p { margin: 4px 0; }

    /* ---- 助教视图 ---- */
    .qa-q { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .qa-q .ts { margin-right: 6px; font-weight: 600; }
    .qa-a { word-break: break-word; color: var(--text); }
    .qa-input-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px;
                    position: sticky; bottom: 0; background: var(--bg);
                    padding: 8px 0 2px; }
    #qa-input { flex: 1; resize: vertical; padding: 8px 10px; font: 13px/1.5 var(--font-body); }
    #qa-send { flex: none; }
    .qa-hint { font-size: 12px; color: var(--dim); margin-top: 6px; }

    /* ---- 草稿视图 ---- */
    #draft { width: 100%; height: 62vh; min-height: 320px; resize: vertical;
             font: 12px/1.6 var(--font-mono); padding: 10px; }
    .vault-row { font-size: 12px; color: var(--dim); }
    .vault-row button { padding: 2px 10px; font-size: 12px; }
    #draft-preview { height: 62vh; min-height: 320px; overflow-y: auto;
                     background: var(--surface); border: 1px solid var(--line);
                     border-radius: var(--radius); padding: 12px 14px; }
    #draft-preview .md-frontmatter { color: var(--dim); font-size: 12px; white-space: pre-wrap;
                                     font-family: var(--font-mono);
                                     border-bottom: 1px dashed var(--line-strong);
                                     margin-bottom: 10px; padding-bottom: 8px; }
    #draft-preview .md-img, #anote img, .qa-a img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
    #draft-preview a, #anote a, .qa-a a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <img src="icons/icon48.png" alt="TransNotes">
      <h1 id="title">视频笔记</h1>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="meta-line">
      <span id="meta"></span>
      <span id="status"></span>
    </div>
  </header>

  <nav>
    <button data-tab="subs" class="on">字幕</button>
    <button data-tab="overview">概览</button>
    <button data-tab="notes">笔记</button>
    <button data-tab="tutor">助教</button>
    <button data-tab="draft">笔记导出</button>
  </nav>

  <section id="tab-subs" class="on">
    <div class="modes">
      <button data-mode="both" class="on">双语</button>
      <button data-mode="zh">中文</button>
      <button data-mode="en">原文</button>
    </div>
    <div id="cues"></div>
  </section>

  <section id="tab-overview">
    <div class="row">
      <button id="gen-overview">生成 / 重新生成概览</button>
    </div>
    <div id="overview"></div>
  </section>

  <section id="tab-notes">
    <div class="notes-layout">
      <div class="notes-tabs">
        <button data-ntab="anote" class="on">自动笔记</button>
        <button data-ntab="mine">我的笔记</button>
      </div>
      <div class="notes-panes">
        <div class="notes-pane on" id="ntab-anote">
          <div class="row">
            <select id="anote-tpl"></select>
            <button id="gen-anote" class="primary">生成笔记</button>
          </div>
          <div id="anote"></div>
        </div>
        <div class="notes-pane" id="ntab-mine">
          <div id="notes"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-tutor">
    <div id="qa-list"></div>
    <div class="qa-input-row">
      <textarea id="qa-input" rows="2" placeholder="就当前视频内容提问…(Ctrl/Cmd+Enter 发送)"></textarea>
      <button id="qa-send" class="primary">提问</button>
    </div>
    <div class="qa-hint">助教回答时自动带入当前播放位置前后约 1 分钟的字幕与全片概览。</div>
  </section>

  <section id="tab-draft">
    <div class="row">
      <button id="gen" class="primary">生成 / 更新草稿</button>
      <button id="export">导出到 Obsidian</button>
      <span class="spacer"></span>
      <div class="modes" style="margin-bottom:0">
        <button data-dmode="edit">编辑</button>
        <button data-dmode="preview" class="on">预览</button>
      </div>
    </div>
    <div class="row vault-row">
      <span id="vault-label">导出位置:…</span>
      <button id="switch-vault" title="临时切换到另一个文件夹(仅本次会话,不改变默认设置)">临时切换…</button>
      <button id="reset-vault" style="display:none" title="恢复为设置页配置的默认 vault">恢复默认</button>
    </div>
    <textarea id="draft" style="display:none" placeholder="点击上方「生成 / 更新草稿」自动生成笔记,可在此基础上编辑"></textarea>
    <div id="draft-preview"></div>
  </section>

  <script src="lib/vendor/marked.min.js"></script>
  <script src="lib/vendor/dompurify.min.js"></script>
  <script src="lib/vendor/katex/katex.min.js"></script>
  <script src="lib/vendor/katex/auto-render.min.js"></script>
  <script src="lib/mdrender.js"></script>
  <script src="lib/cache.js"></script>
  <script src="lib/notes.js"></script>
  <script src="lib/exporter.js"></script>
  <script src="lib/shotedit.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
